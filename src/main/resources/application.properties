spring.application.name=${SPRING_APPLICATION_NAME:OnetBundleHub}

# ============================================================
# Management
# ============================================================
management.endpoints.web.exposure.include=mappings,health,info


# ============================================================
# Korapay
# ============================================================
korapay.secret-key=${KORAPAY_SECRET_KEY:}
korapay.public-key=${KORAPAY_PUBLIC_KEY:}
korapay.base-url=${KORAPAY_BASE_URL:https://api.korapay.com}


# ============================================================
# Database - PostgreSQL / Neon
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}


# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# ============================================================
# Flyway
# ============================================================
spring.flyway.enabled=${FLYWAY_ENABLED:false}


# ============================================================
# Jackson
# ============================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC


# ============================================================
# JWT
# ============================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiry-ms=${JWT_ACCESS_EXPIRY_MS:28800000}
app.jwt.refresh-token-expiry-ms=${JWT_REFRESH_EXPIRY_MS:2592000000}


# ============================================================
# BigDreams API
# ============================================================
bigdreams.api-key=${BIGDREAMS_API_KEY}
bigdreams.base-url=${BIGDREAMS_BASE_URL:https://qrzjkrkawcdoaggblvjc.supabase.co/functions/v1/developer-api}


# ============================================================
# CORS
# ============================================================
app.cors.allowed-origin=${APP_CORS_ORIGIN:http://localhost:3000}


# ============================================================
# General Application
# ============================================================
app.base-url=${APP_BASE_URL:https://www.databaygh.shop}
app.from-email=${APP_FROM_EMAIL:noreply@databundleshub.com}
app.from-name=${APP_FROM_NAME:DataBundlesHub}
app.reseller.min-payout-ghc=${MIN_PAYOUT_GHC:5.00}


# ============================================================
# Paystack
# ============================================================
paystack.secret-key=${PAYSTACK_SECRET_KEY:}
paystack.public-key=${PAYSTACK_PUBLIC_KEY:}
paystack.base-url=${PAYSTACK_BASE_URL:https://api.paystack.co}


# ============================================================
# Databundleshub Dealer API
# ============================================================
dbh.base-url=${DBH_BASE_URL:https://databundleshub.com}


# ============================================================
# SendGrid
# ============================================================
sendgrid.api-key=${SENDGRID_API_KEY:}


# ============================================================
# Arkesel SMS
# ============================================================
arkesel.api-key=${ARKESEL_API_KEY:}


# ============================================================
# Server
# ============================================================
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always


# ============================================================
# Logging
# ============================================================
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.databundleHum=${LOGGING_LEVEL_COM_DATABUNDLEHUM:DEBUG}
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:WARN}
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_HIBERNATE_SQL:WARN}

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n


# ============================================================
# Swagger / OpenAPI
# ============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true


# ============================================================
# Bestman API
# ============================================================
bestman.api-key=${BESTMAN_API_KEY:}
bestman.base-url=${BESTMAN_BASE_URL:https://cleanheartsolutions.com/api}
bestman.webhook-url=${BESTMAN_WEBHOOK_URL:}


# ============================================================
# DataBossHub API
# ============================================================
databosshub.api-key=${DATABOSSHUB_API_KEY}
databosshub.base-url=${DATABOSSHUB_BASE_URL:https://api.databosshub.example.com}


# ============================================================
# DataPrimo API
# ============================================================
dataprimo.api-key=${DATAPRIMO_API_KEY}
dataprimo.base-url=${DATAPRIMO_BASE_URL:}